services:
    # Laravel App Container
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www
        # In production, we usually copy files inside the image,
        # but volumes can be kept for persistent storage if needed.
        volumes:
            - .:/var/www
        depends_on:
            - db
            - redis
        networks:
            - laravel_net

    # Nginx Web Server
    nginx:
        image: nginx:alpine
        container_name: laravel_nginx
        restart: unless-stopped
        ports:
            - "80:80" # Exposed to the public web
        volumes:
            - .:/var/www
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel_net

    # MySQL Database
    db:
        image: mysql:8.0
        container_name: laravel_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_USER: ${DB_USERNAME:-laravel}
        volumes:
            - dbdata:/var/lib/mysql
        # NOTICE: No ports are exposed to the host to prevent unauthorized external access.
        # App container can still connect to "db:3306" internally.
        networks:
            - laravel_net

    # Redis Cache & Queue
    redis:
        image: redis:alpine
        container_name: laravel_redis
        restart: unless-stopped
        volumes:
            - redis_data:/data
        # NOTICE: Redis is isolated inside the docker network.
        networks:
            - laravel_net

    # Cloudflare Bot Challenge Solver
    flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        container_name: flaresolverr
        restart: unless-stopped
        ports:
            - "8191:8191"
        environment:
            - LOG_LEVEL=info
        networks:
            - laravel_net

networks:
    laravel_net:
        driver: bridge

volumes:
    dbdata:
        driver: local
    redis_data:
        driver: local
